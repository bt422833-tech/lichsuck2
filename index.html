let mcq = [

{q:"Câu 1. Trong những năm 1905-1908, Phan Bội Châu không có hoạt động nào sau đây ?",a:["Đưa thanh niên Việt Nam sang Nhật Bản học tập ở một số trường tư thục.","Thành lập Đông Á Đồng minh Hội và Điền – Quế - Việt Liên minh.","Vận động sự ủng hộ của chính giới Nhật Bản cho công cuộc giải phóng dân tộc.","Thành lập tổ chức Việt Nam Quang phục hội ở Trung Quốc."],c:3},

{q:"Câu 2. Nội dung nào sau đây phản ánh đúng về hoạt động đối ngoại của Phan Châu Trinh trong những năm 1911-1925?",a:["Tổ chức các buổi diễn thuyết để thức tỉnh dư luận Pháp về tình hình Việt Nam.","Tìm kiếm sự giúp đỡ quân sự từ các nước phương Tây để chống thực dân Pháp.","Gắn hoạt động đối ngoại với việc tập trung xây dựng lực lượng vũ trang trong nước.","Chủ trương dựa vào Nhật Bản để giành độc lập dân tộc bằng con đường bạo động."],c:0},

{q:"Câu 3. Nội dung nào sau đây phản ánh đúng về mục tiêu hoạt động đối ngoại của Đảng Cộng sản Đông Dương trong giai đoạn 1941-1945?",a:["Bước đầu thiết lập quan hệ giữa cách mạng Việt Nam với Quốc tế Cộng sản để giải phóng dân tộc.","Chủ động tham gia các liên minh khu vực nhằm mở rộng ảnh hưởng của cách mạng Đông Dương.","Thiết lập quan hệ ngoại giao chính thức với các cường quốc để khẳng định vị thế quốc gia độc lập.","Tranh thủ sự ủng hộ của lực lượng tiến bộ quốc tế nhằm phục vụ cho mục tiêu giải phóng dân tộc."],c:3},

{q:"Câu 4. Sự ra đời của Liên minh nhân dân Việt – Miên – Lào có ý nghĩa nào sau đây đối với cách mạng Đông Dương?",a:["Đánh dấu sự ra đời của chính Đảng vô sản ở mỗi nước Đông Dương.","Đánh dấu thắng lợi của cuộc kháng chiến chống Pháp ở Đông Dương.","Giải quyết triệt để vấn đề dân tộc trong khuôn khổ từng nước Đông Dương.","Làm thất bại âm mưu chia rẽ khối đoàn kết của ba nước."],c:3},

{q:"Câu 5. Trước ngày 6-3-1946, nước Việt Nam Dân chủ Cộng hòa thực hiện chính sách đối ngoại nào sau đây?",a:["Hòa Pháp để đuổi Trung.","Hòa với Trung Hoa Dân quốc để đánh Pháp.","Hòa hoãn với cả Pháp và Tưởng.","Hòa hoãn với Anh để đánh đuổi Nhật."],c:1},

{q:"Câu 6. Trong quá trình hoạt động cách mạng những năm 1920 – 1925, Nguyễn Ái Quốc đã tham gia thành lập tổ chức nào sau đây?",a:["Tâm tâm xã.","Mặt trận Việt Minh.","Hội Liên hiệp thuộc địa.","Duy Tân hội."],c:2},

{q:"Câu 7. Nội dung nào sau đây phản ánh điểm tương đồng cơ bản của đấu tranh ngoại giao trong cuộc kháng chiến chống thực dân Pháp (1945 – 1954) và đế quốc Mỹ (1954 – 1975) ở Việt Nam?",a:["Đấu tranh ngoại giao luôn đi trước mở đường cho đấu tranh quân sự.","Mặt trận ngoại giao được hình thành ngay từ đầu cuộc kháng chiến.","Đấu tranh ngoại giao có mối quan hệ chặt chẽ với đấu tranh chính trị.","Hoạt động ngoại giao chịu sự chi phối hoàn toàn của hoạt động quân sự."],c:2},

{q:"Câu 8. Năm 1995, Việt Nam bình thường hóa quan hệ ngoại giao với ?",a:["Nhật Bản.","Mỹ.","Liên Xô.","Ấn Độ."],c:1},

{q:"Câu 9. Trong bối cảnh quốc tế đang diễn ra theo nhiều xu thế mới với những diễn biến phức tạp, chủ trương nhất quán của Đảng và Nhà nước Việt Nam là ?",a:["Hội nhập quốc tế để thu hút vốn từ bên ngoài bằng mọi giá.","Tham gia liên minh chính trị với Mỹ và các nước phương Tây.","Chủ động kết nối các cường quốc để nâng tầm đối tác chiến lược.","Đa phương hóa, đa dạng hóa các quan hệ quốc tế trên cơ sở bình đẳng."],c:3},

{q:"Câu 10. Từ thực tiễn của hoạt động đối ngoại trong 30 năm chiến tranh giải phóng dân tộc, Việt Nam cần phát huy bài học nào sau đây trong chính sách đối ngoại hiện nay?",a:["Tuyệt đối không tiến hành các hoạt động ngoại giao với quốc gia cựu thù.","Nhân nhượng vô nguyên tắc để có thêm thời gian chuẩn bị lực lượng.","Chủ quyền, lợi ích quốc gia phải là thượng tôn, bất khả xâm phạm.","Xây dựng liên minh quân sự với các cường quốc để tranh thủ sự giúp đỡ."],c:2},

{q:"Câu 11. Năm 1996, Việt Nam là một trong những thành viên sáng lập của ?",a:["Hội đồng tương trợ kinh tế.","Phong trào Không liên kết.","Tổ chức Thương mại thế giới.","Diễn đàn Á – Âu (ASEM)."],c:3},

{q:"Câu 12. Từ năm 1991 trở đi, ngoại giao đa phương Việt Nam bước vào thời kì phát triển mới là do tác động của yếu tố nào sau đây?",a:["Quá trình công nghiệp hóa đã hoàn thành.","Sự thay đổi tích cực trong tư duy đối ngoại của Đảng Cộng sản Việt Nam.","Âm mưu chống phá đã được ngăn chặn.","Cơ sở vật chất trong nước được cải thiện."],c:1},

{q:"Câu 13. Nội dung nào sau đây là đặc điểm hoạt động đối ngoại của Việt Nam từ năm 1975 đến nay?",a:["Thực hiện nhiệm vụ bảo vệ độc lập dân tộc và thống nhất đất nước.","Gắn hội nhập quốc tế với củng cố độc lập, hòa bình, ổn định và tiến bộ xã hội.","Đối ngoại Đảng, Nhà nước và nhân dân bắt đầu xuất hiện.","Vận dụng linh hoạt sách lược “vừa đánh, vừa đàm”."],c:1},

{q:"Câu 14. Nội dung nào sau đây là một trong những yếu tố tác động đến quyết định ra đi tìm đường cứu nước của Nguyễn Tất Thành?",a:["Phong trào đấu tranh theo khuynh hướng vô sản diễn ra rộng khắp.","Cách mạng Việt Nam hoàn toàn đi theo khuynh hướng dân chủ tư sản.","Thực dân Pháp hoàn thành khai thác thuộc địa lần thứ hai.","Nguyện vọng cứu nước, giải phóng dân tộc trở nên cấp thiết."],c:3},

{q:"Câu 15. Năm 1941, Nguyễn Ái Quốc trở về nước và thành lập tổ chức nào sau đây?",a:["Mặt trận Việt Minh.","Hội Việt Nam Cách mạng thanh niên.","Đảng Cộng sản Việt Nam.","Thanh niên Cộng sản đoàn."],c:0},

{q:"Câu 16. Nguyên nhân chủ yếu nào sau đây dẫn đến sự thất bại của phong trào yêu nước chống Pháp ở Việt Nam cuối thế kỉ XIX đầu thế kỉ XX?",a:["Chưa có các khuynh hướng cứu nước khác nhau.","Nhân dân chưa có quyết tâm cao.","Các phong trào chưa phát triển mạnh.","Sự không phù hợp của khuynh hướng cứu nước."],c:3},

{q:"Câu 17. Từ hành trình ra đi tìm đường cứu nước của Nguyễn Tất Thành, thế hệ trẻ ngày nay cần rút ra bài học nào?",a:["Đặt lợi ích cá nhân lên trên hết.","Cống hiến sức trẻ cho đất nước.","Chỉ làm việc ở nước ngoài.","Chọn nghề dễ kiếm tiền."],c:1},

{q:"Câu 18. Trong thời gian ở Liên Xô (1923-1924), Nguyễn Ái Quốc hoạt động đối ngoại nào sau đây?",a:["Tham dự Đại hội V Quốc tế Cộng sản.","Tham gia thành lập Đảng Cộng sản Pháp.","Gửi bản yêu sách.","Thành lập Hội liên hiệp thuộc địa."],c:0},

{q:"Câu 19. Đoạn tư liệu phản ánh vai trò của Hồ Chí Minh trong quá trình ?",a:["Ra nước ngoài tìm đường cứu nước.","Chuẩn bị thành lập Đảng.","Lãnh đạo kháng chiến.","Chuẩn bị thành lập Đảng Cộng sản Việt Nam."],c:1},

{q:"Câu 20. Nguyễn Ái Quốc đề xuất thành lập Mặt trận Việt Minh tại đâu?",a:["Bắc Sơn.","Tân Trào.","Võ Nhai.","Pác Bó."],c:3},

{q:"Câu 21. Bài học không đúng từ thắng lợi của Việt Minh là?",a:["Xây dựng khối đoàn kết toàn dân.","Chính sách linh hoạt.","Đoàn kết quốc tế.","Bỏ qua vai trò nhân dân."],c:3},

{q:"Câu 22. Nội dung nào không đúng về yếu tố gia đình ảnh hưởng đến Hồ Chí Minh?",a:["Gia đình bóc lột.","Truyền thống yêu nước.","Xuất thân nhà nho.","Gia đình nhà giáo."],c:0},
{q:"Câu 23. Phương hướng cơ bản của cách mạng miền Nam được xác định trong Hội nghị lần thứ 15 Ban Chấp hành Trung ương Đảng Lao động Việt Nam (1-1959) do Hồ Chí Minh chủ trì là ?",a:["Xây dựng chủ nghĩa xã hội và đấu tranh thống nhất nước nhà.","Khởi nghĩa giành chính quyền về tay nhân dân.","Đưa ra những dự báo và thể hiện quyết tâm thắng Mỹ.","Toàn dân, toàn diện, trường kì, tự lực cánh sinh."],c:1},

{q:"Câu 24. Trong quá trình chuẩn bị về tư tưởng, chính trị để thành lập Đảng Cộng sản Việt Nam (1919 – 1929), Nguyễn Ái Quốc có vai trò nổi bật nào sau đây?",a:["Xây dựng lí luận cách mạng giải phóng dân tộc kết hợp với giải phóng giai cấp.","Thành lập tổ chức theo hướng tư sản.","Ra báo Thanh niên để phục vụ Hội Liên hiệp thuộc địa.","Soạn thảo Cương lĩnh chính trị và thông qua tại Hội nghị thành lập Đảng."],c:0},

{q:"Câu 25. Trong quá trình chuẩn bị về tổ chức để thành lập Đảng Cộng sản Việt Nam (1919 – 1929), Nguyễn Ái Quốc có sự sáng tạo nào sau đây?",a:["Chủ nhiệm báo Người cùng khổ.","Xuất bản Đường Kách mệnh.","Thành lập các tổ chức cộng sản trước khi thành lập Đảng.","Viết Bản án chế độ thực dân Pháp."],c:2},

{q:"Câu 26. Nội dung nào sau đây thể hiện vai trò quyết định của Hồ Chí Minh đối với thắng lợi của Cách mạng tháng Tám năm 1945 ở Việt Nam?",a:["Đề xuất và chỉ đạo thực hiện Tổng khởi nghĩa.","Xây dựng bộ máy chính quyền.","Tranh thủ sự ủng hộ quốc tế.","Soạn thảo kế hoạch khởi nghĩa."],c:0},

{q:"Câu 27. Nhận xét nào sau đây phản ánh đúng điểm mới về hoạt động của Nguyễn Ái Quốc trong giai đoạn 1925-1929 so với giai đoạn 1920-1924?",a:["Tăng cường gắn cách mạng Việt Nam với thế giới.","Hoạch định con đường cách mạng.","Chuẩn bị trực tiếp điều kiện cho sự ra đời Đảng Cộng sản Việt Nam.","Thành lập tổ chức cộng sản."],c:2},
